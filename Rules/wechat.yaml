# > WeChat / Tencent 域名规则(domain behavior)
# - 合并来源:Aegis WeChat.list(2026-04-21)+ iOS App隐私报告实测(2026-07-02~07-09)
# - 整理原则:+. 通配已覆盖的子域条目全部去除(domain trie 中父域通配使子域条目完全失效)
# - 整理时间:2026-07-09

payload:
    # ── 腾讯主域(覆盖原列表中全部 *.qq.com 条目:weixin/wx/tc/y/dldir/imgcache/urlsec/isdspeed/ptlogin2 等 40+ 条)──
    - +.qq.com
    - +.qq.com.cn          # 接入/兼容域:dns.weixin.qq.com.cn、wxqcloud.qq.com.cn、szminorca 等

    # ── 微信自有域 ──
    - +.weixin.com
    - +.wechat.com         # 国际版:connect/web/passport/update/dl/security 等子域全覆盖
    - +.weixinbridge.com   # JSBridge(cube.)

    # ── 支付 ──
    - +.wechatpay.cn       # paydns/gtimg/tenpay 子域全覆盖
    - +.wechatpay.com
    - +.tenpay.com

    # ── 多媒体 CDN ──
    - +.qpic.cn            # mmsns/mmchatpic/mmbiz/ugc/store/wework 等子域全覆盖
    - +.qlogo.cn           # wx/thirdwx/mmbiz 头像子域全覆盖
    - +.gtimg.cn
    - +.gtimg.com
    - +.mmbiz.qcloudimg.com # 公众号历史图片节点(未放宽到 qcloudimg.com 主域)
    - +.cdn-go.cn

    # ── 小程序 / 云开发 ──
    - +.servicewechat.com
    - +.servicewechat.cn
    - +.tcb.qcloud.la
    - +.cloudbase.net
    - +.wx.cloud.tencent.com

    # ── 腾讯云基建(微信登录加速/网络质量/PCDN 调度)──
    - +.teg.tencent-cloud.net  # 覆盖 add-pcdnwxlogin / apd-pcdnwxstat / apd-pcdnieghplogin

    # ── 推送 ──
    - +.tpns.sh.tencent.com    # 覆盖 guid. / access1.

    # ── 视频号直播 / 腾讯音乐 ──
    - +.tlivedns.com
    - +.tlivesource.com
    - +.tencentmusic.com

    # ── 待确认 ──
    - +.kk-rays.com        # ⚠ 非已知腾讯域,原列表归在"QQ/微信登录"下,来源不明,建议核实后决定去留

