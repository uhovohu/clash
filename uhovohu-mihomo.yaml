# ===== 锚点 Providers =====
rule-anchor:
  domain:       &domain       {type: http, behavior: domain,    format: mrs,  interval: 86400, proxy: Proxy}   # 域名，mrs 格式
  ip:           &ip           {type: http, behavior: ipcidr,    format: mrs,  interval: 86400, proxy: Proxy}   # IP，mrs 格式

# ===== 远程规则集 Remote Rule =====
