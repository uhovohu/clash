# =======================================================
# 6. 策略组 Proxy Groups
# =======================================================

# ── 地区节点匹配正则 支持国旗 / 中英文 / 地区代码 排除带有 "=>" 前缀的落地节点 ──
FilterHK: &FilterHK '(?i)^(?!=>).*(?:🇭🇰|香港|Hong\s?Kong|\b(?:HK|HKG)\d*\b)'
FilterTW: &FilterTW '(?i)^(?!=>).*(?:🇹🇼|台湾|Tai(?:wan)?|\b(?:TW|TWN)\d*\b)'
FilterJP: &FilterJP '(?i)^(?!=>).*(?:🇯🇵|日本|川日|东京|大阪|埼玉|Japan|\b(?:JP|JPN)\d*\b)'
FilterKR: &FilterKR '(?i)^(?!=>).*(?:🇰🇷|韩国|韓|首尔|Korea|\b(?:KR|KOR)\d*\b)'
FilterSG: &FilterSG '(?i)^(?!=>).*(?:🇸🇬|新加坡|狮|Singapore|\b(?:SG|SGP)\d*\b)'
FilterUS: &FilterUS '(?i)^(?!=>).*(?:🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|拉斯维加斯|United States|\b(?:US|USA)\d*\b)'

# ── 全局节点净化 排除广告 / 流量信息 / 到期时间等非节点内容 排除带有 "=>" 前缀的落地节点 ──
FilterAll: &FilterAll '^(?!.*(?:(?i)=>|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$'

# ── 提取带有 "=>" 前缀的落地节点，同时排除垃圾信息 ──
FilterOut: &FilterOut '^(?=.*=>)(?!.*(?:(?i)群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$'

# ── Others节点过滤 在净化的基础上，排除已提取的常用地区节点 排除带有 "=>" 前缀的落地节点 ──
FilterOthers: &FilterOthers '^(?!.*(?:(?i)=>|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$'

# ── 策略组 ──
proxy-groups:
  # ── 链式代理 ──
  - {name: IN,  type: select, include-all: true, filter: *FilterAll, icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/in.png"}                                                        # 入口节点：链路第一跳，流量先进入此节点 一般是线路节点
  - {name: OUT, type: select, include-all: true, filter: *FilterOut, icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/out.png"}                                                           # 出口节点：链路第二跳，由 入口节点 中转到 出口节点， 一般是落地节点

  # ── Proxy ──
  - {name: Proxy,       type: select, include-all: true, filter: *FilterAll, proxies: [OUT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/proxy.png"}                                             # 全部节点手动选择入口

  # ── Proxy App ──
  - {name: Crypto,      type: select, proxies: [Proxy, DIRECT, REJECT, OUT, HK, TW, JP, KR, SG, US, OTHERS1, OTHERS2], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/crypto.png"}       # 加密货币（交易所 / 行情 / 杂项）

  - {name: OpenAI,      type: select, proxies: [Proxy, DIRECT, REJECT, OUT, HK, TW, JP, KR, SG, US, OTHERS1, OTHERS2], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/chatgpt.png"}      # OpenAI / ChatGPT
  - {name: Anthropic,   type: select, proxies: [Proxy, DIRECT, REJECT, OUT, HK, TW, JP, KR, SG, US, OTHERS1, OTHERS2], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/claude.png"}       # Anthropic / Claude
  - {name: AI,          type: select, proxies: [Proxy, DIRECT, REJECT, OUT, HK, TW, JP, KR, SG, US, OTHERS1, OTHERS2], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/ai.png"}           # AI 杂项 (Perplexity / Groq / Cerebras / HuggingFace / Cursor / ElevenLabs / ComfyUI / 兜底)
  - {name: YouTube,     type: select, proxies: [Proxy, DIRECT, REJECT, OUT, HK, TW, JP, KR, SG, US, OTHERS1, OTHERS2], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/youtube.png"}      # YouTube
  - {name: Google,      type: select, proxies: [Proxy, DIRECT, REJECT, OUT, HK, TW, JP, KR, SG, US, OTHERS1, OTHERS2], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/google.png"}       # Google 全家桶
  - {name: Cloudflare,  type: select, proxies: [Proxy, DIRECT, REJECT, OUT, HK, TW, JP, KR, SG, US, OTHERS1, OTHERS2], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/cloudflare.png"}   # Cloudflare
