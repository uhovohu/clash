
# =======================================================
# 1. 机场订阅 Proxy Providers
# =======================================================

proxy-providers:
  provider1:                                                                                    # 订阅链接，如需多个订阅请复制整段 并修改 provider1 字段 保证唯一性
    url: "填入订阅"
    type: http
    interval: 86400
    health-check: {enable: true, lazy: true, url: "https://www.gstatic.com/generate_204",interval: 3600}
    proxy: DIRECT
  
  provider2:                                                                                    # 订阅链接，如需多个订阅请复制整段 并修改 provider2 字段 保证唯一性
    url: "填入订阅"
    type: http
    interval: 86400
    health-check: {enable: true, lazy: true, url: "https://www.gstatic.com/generate_204",interval: 3600}
    proxy: DIRECT  

#proxies:                                                                                       # 手动节点的链式代理建议去参考官方文档填写
#  - name: "手动节点1"
#  - name: "手动节点2"


# 2. 全局参数 Global Settings
# =======================================================

# ── 系统设置 ──
mixed-port: 7890                             # 混合代理端口
allow-lan: true                              # 允许局域网连接
bind-address: "*"                            # 绑定所有网卡 IP，确保本机所有内网 IP 都能接收局域网请求
ipv6: true                                   # 允许 IPv6：TUN 接管设备的 IPv6 流量防泄漏，并可使用 IPv6 节点
log-level: warning                           # 日志级别 仅记录警告和错误，保持后台清爽并节省硬盘

# ── 分流与防封锁机制 ──
find-process-mode: "off"                     # 进程匹配模式: off 关闭进程规则/ strict 按需精准匹配/ always 强制查询耗性能
global-client-fingerprint: chrome            # 全局 TLS 指纹伪装: 伪装为正常浏览器，降低节点被墙概率 可选 chrome/ios/random 等

# ── 性能与连接优化 ──
unified-delay: true                          # 统一延迟计算方式
tcp-concurrent: true                         # 开启 TCP 并发连接，大幅加快多图网页加载速度
keep-alive-idle: 60                          # TCP 空闲 60 秒后启动保活探针
keep-alive-interval: 15                      # 保活心跳包发送间隔 15 秒

# ── 运行状态持久化 ──
profile:                                     # 记忆功能
  store-selected: true                       # 记忆手动选择的节点
  store-fake-ip: true                        # 记忆 Fake-IP 映射表

# ── Clash api ──                            # 默认注释 Nikki可取消注释使用  win mac等桌面gui客户端保持注释避免冲突
#external-controller: 0.0.0.0:9095
#secret: ""
#external-ui: ui
#external-ui-name: zashboard
#external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# =======================================================
# 3. 流量嗅探 Sniffer
# =======================================================

# ── Sniffer ──
sniffer:
  enable: true                               # 核心开关 开启流量嗅探
  parse-pure-ip: true                        # 对纯 IP 连接也进行嗅探，补全分流判断
  override-destination: false                # 嗅探域名仅用于规则匹配，不改写连接目标，避免 SNI 不一致导致连错
  sniff:
    HTTP:
      ports: [80, 8080]                      # 嗅探 HTTP 协议的标准端口及常见的非标大端口
    TLS:
      ports: [443]                           # 嗅探 HTTPS/TLS 加密流量，通过读取握手包中的 SNI 获取真实域名
    QUIC:
      ports: [443]                           # 嗅探 QUIC HTTP/3 协议流量
  skip-domain:                               # 嗅探豁免名 嗅探读出的域名在以下名单里就不采用（包照样会读），按原来的域名或 IP 分流
    - "rule-set:R-private"                   # 内网域名
    - "rule-set:R-connectivity"              # 连通性检测
    - "rule-set:R-cn-misc-realip"            # 国内真实 IP 杂项
    - "rule-set:R-stun@cn"                   # 国内 STUN
    - "rule-set:R-cdn-cn"                    # 国内 CDN
    - "rule-set:R-bank-cn"                   # 国内银行
    - "rule-set:R-securities-cn"             # 国内证券
    - "rule-set:R-finance-cn"                # 国内金融
    - "rule-set:R-wechat"                    # 微信
    - "rule-set:R-sniffer-skip-misc"         # 不嗅探杂项（米家云）

  skip-dst-address:                          # 目的地址豁免 遇到以下 IP 地址直接放行不拆包，防止破坏特殊协议导致断连
    - "rule-set:R-sniffer-skip-ip"           # 不嗅探 IP
    - "rule-set:R-private-ip"                # 内网 IP
    - "rule-set:R-telegram-ip"               # Telegram IP
    - "rule-set:R-apple-ip"                  # 苹果 IP
    - "rule-set:R-wechat-ip"                 # 微信 IP
    - "rule-set:R-cn-misc-ip"                # 国内杂项 IP

# =======================================================
# 4. 虚拟网卡 TUN
# =======================================================
tun:
  enable: true                               # 开启 TUN 虚拟网卡
  stack: mixed                               # 混合网络栈：TCP 走 system (高性能)，UDP 走 gVisor (高兼容)
  dns-hijack: ["udp://any:53", "tcp://any:53"]   # 双重劫持标准 DNS 端口，彻底防泄漏
  #device: nikki                             #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  
  #使用仅内核自行修改下面三项为true 路由控制 使用 GUI 客户端保持 false，纯内核命令行运行改为 true
  auto-route: false                          # 不自动修改系统路由表，交由外层客户端管理，防冲突
  auto-redirect: false                       # 不自动配置重定向流量规则
  auto-detect-interface: false               # 不自动探测物理出口网卡
  strict-route: false                        # 严格路由限制 开启后物理网卡被锁死，GUI 环境建议 false

# =======================================================
# 5. DNS
# =======================================================

dns:
  # ── 运行参数 ──
  enable: true                               # 开启内置 DNS 服务
  cache-algorithm: arc                       # DNS 缓存淘汰算法 ARC 相比传统 LRU 命中率更高
  listen: 0.0.0.0:1053                       # DNS 服务监听端口
  ipv6: false                                # 关闭 IPv6 解析 保持与全局设置一致
  respect-rules: true                        # DNS 请求遵循分流规则
  prefer-h3: false                           # 关闭 DoH/DoT 的 HTTP/3 传输，提升解析速度和稳定性
  
  # ── Fake-IP ──
  enhanced-mode: fake-ip                     # 开启 Fake-IP 增强模式 秒回假 IP，极大提升网络响应速度
  fake-ip-range: 198.18.0.1/16               # IANA 保留给 网络基准测试用的段（RFC 2544/6815），明确不会公网路由，安全可靠
  fake-ip-filter-mode: blacklist             # 黑名单过滤模式 名单内的域名不返回假 IP，要求真实解析

  # ── DNS ──
  default-nameserver:                        # 基础启动 用于最底层解析下方 proxy-server-nameserver 本身及代理节点的域名
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:                   # 节点专线 专职负责解析 “节点” 和 “订阅链接” 的真实 IP
    - 119.29.29.29
    - 114.114.114.114
    - 223.5.5.5
    #- https://223.5.5.5/dns-query
    #- https://doh.pub/dns-query
  direct-nameserver:                         # 直连兜底 专职负责解析走 DIRECT 分流规则的域名
    - 223.5.5.5
    - 119.29.29.29
  nameserver:                                # 国外兜底 处理所有未知的兜底域名，防止 DNS 污染 附带节点选择强制走代理出境
    - 8.8.8.8#Proxy&disable-qtype-65=true
    #- 1.1.1.1#Proxy&disable-qtype-65=true
    
    
  # ── DNS 分流 ──
  nameserver-policy:
    "rule-set:R-private":         [system]                           # 内网域名
    "rule-set:R-wechat":          [system, 223.5.5.5, 119.29.29.29]  # 微信
    "rule-set:R-apple":           [system, 223.5.5.5, 119.29.29.29]  # 苹果全家
    "rule-set:R-appleakamai":     [system, 223.5.5.5, 119.29.29.29]  # 苹果 Akamai 地址
    "rule-set:R-alibaba@cn":      [system, 223.5.5.5, 119.29.29.29]  # 阿里国内
    "rule-set:R-bytedance@cn":    [system, 223.5.5.5, 119.29.29.29]  # 字节国内（抖音、飞书等）
    "rule-set:R-jd@cn":           [system, 223.5.5.5, 119.29.29.29]  # 京东国内
    "rule-set:R-meituan":         [system, 223.5.5.5, 119.29.29.29]  # 美团
    "rule-set:R-netease@cn":      [system, 223.5.5.5, 119.29.29.29]  # 网易国内
    "rule-set:R-getui":           [system, 223.5.5.5, 119.29.29.29]  # 个推
    "rule-set:R-connectivity":    [system, 223.5.5.5, 119.29.29.29]  # 连通性检测
    "rule-set:R-cas@cn":          [system, 223.5.5.5, 119.29.29.29]  # 证书机构国内
    "rule-set:R-stun@cn":         [system, 223.5.5.5, 119.29.29.29]  # 国内 STUN
    "rule-set:R-cdn-cn":          [system, 223.5.5.5, 119.29.29.29]  # 国内 CDN
    "rule-set:R-bank-cn":         [system, 223.5.5.5, 119.29.29.29]  # 国内银行
    "rule-set:R-securities-cn":   [system, 223.5.5.5, 119.29.29.29]  # 国内证券
    "rule-set:R-finance-cn":      [system, 223.5.5.5, 119.29.29.29]  # 国内金融
    "rule-set:R-ntp@cn":          [system, 223.5.5.5, 119.29.29.29]  # 国内 NTP
    "rule-set:R-games-cn":        [system, 223.5.5.5, 119.29.29.29]  # 国内游戏
    "rule-set:R-cn-misc-realip":  [system, 223.5.5.5, 119.29.29.29]  # 国内真实 IP 杂项

  # ── Fake-IP ──
  # 跟上面 nameserver-policy 保持一致
  fake-ip-filter:
    - "rule-set:R-private"                   # 内网域名
    - "rule-set:R-wechat"                    # 微信
    - "rule-set:R-apple"                     # 苹果全家
    - "rule-set:R-appleakamai"               # 苹果 Akamai 地址
    - "rule-set:R-alibaba@cn"                # 阿里国内
    - "rule-set:R-bytedance@cn"              # 字节国内（抖音、飞书等）
    - "rule-set:R-jd@cn"                     # 京东国内
    - "rule-set:R-meituan"                   # 美团
    - "rule-set:R-netease@cn"                # 网易国内
    - "rule-set:R-getui"                     # 个推
    - "rule-set:R-connectivity"              # 连通性检测
    - "rule-set:R-cas@cn"                    # 证书机构国内
    - "rule-set:R-stun@cn"                   # 国内 STUN
    - "rule-set:R-cdn-cn"                    # 国内 CDN
    - "rule-set:R-bank-cn"                   # 国内银行
    - "rule-set:R-securities-cn"             # 国内证券
    - "rule-set:R-finance-cn"                # 国内金融
    - "rule-set:R-ntp@cn"                    # 国内 NTP
    - "rule-set:R-games-cn"                  # 国内游戏
    - "rule-set:R-cn-misc-realip"            # 国内真实 IP 杂项


# =======================================================
# 6. 策略组 Proxy Groups
# =======================================================

# ── 全局节点净化 排除广告 / 流量信息 / 到期时间等非节点内容 排除带有 "=>" 前缀的落地节点 ──
FilterAll: &FilterAll '^(?!.*(?:(?i)=>|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$'

# ── 策略组 ──
proxy-groups:
  
  # ── Proxy ──
  - {name: Proxy,       type: select, include-all: true, filter: *FilterAll, icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/proxy.png"}                                        # 全部节点手动选择入口

  # ── Proxy App ──
  - {name: OpenAI,      type: select, include-all: true, filter: *FilterAll, proxies: [Proxy, DIRECT, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/chatgpt.png"}    # OpenAI / ChatGPT
  - {name: Anthropic,   type: select, include-all: true, filter: *FilterAll, proxies: [Proxy, DIRECT, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/claude.png"}     # Anthropic / Claude
  - {name: AI,          type: select, include-all: true, filter: *FilterAll, proxies: [Proxy, DIRECT, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/ai.png"}         # AI 杂项 (Perplexity / 兜底)
  - {name: YouTube,     type: select, include-all: true, filter: *FilterAll, proxies: [Proxy, DIRECT, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/youtube.png"}    # YouTube
  - {name: Google,      type: select, include-all: true, filter: *FilterAll, proxies: [Proxy, DIRECT, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/google.png"}     # Google 全家桶
  - {name: GitHub,      type: select, include-all: true, filter: *FilterAll, proxies: [Proxy, DIRECT, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/github.png"}     # GitHub
  - {name: Microsoft,   type: select, include-all: true, filter: *FilterAll, proxies: [CN, Proxy, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/microsoft.png"}  # Microsoft 全家桶
  - {name: Apple,       type: select, include-all: true, filter: *FilterAll, proxies: [CN, Proxy, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/apple.png"}      # Apple 全家桶

  - {name: X,           type: select, include-all: true, filter: *FilterAll, proxies: [Proxy, DIRECT, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/x.png"}          # X / Twitter / 马斯克系
  - {name: Telegram,    type: select, include-all: true, filter: *FilterAll, proxies: [Proxy, DIRECT, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/telegram.png"}   # Telegram

  - {name: TikTok,      type: select, include-all: true, filter: *FilterAll, proxies: [Proxy, DIRECT, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/tiktok.png"}     # TikTok / 字节跳动海外
  - {name: Netflix,     type: select, include-all: true, filter: *FilterAll, proxies: [Proxy, DIRECT, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/netflix.png"}    # Netflix
  - {name: Spotify,     type: select, include-all: true, filter: *FilterAll, proxies: [Proxy, DIRECT, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/spotify.png"}    # Spotify
  
  - {name: Steam,       type: select, include-all: true, filter: *FilterAll, proxies: [CN, Proxy, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/steam.png"}      # Steam

  # ── CN / Final ──
  - {name: CN,          type: select, include-all: true, filter: *FilterAll, proxies: [DIRECT, Proxy, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/cn.png"}         # 默认国内直连
  - {name: Final,       type: select, include-all: true, filter: *FilterAll, proxies: [Proxy, DIRECT, REJECT], icon: "https://raw.githubusercontent.com/uhovohu/clash/main/icons/final.png"}      # 未匹配流量

# =======================================================
# 7. 规则源 Rule Providers
# =======================================================

# ===== 锚点 Providers =====
rule-anchor:
  domain:       &domain       {type: http, behavior: domain,    format: mrs,  interval: 86400, proxy: Proxy}   # 域名，mrs 格式
  ip:           &ip           {type: http, behavior: ipcidr,    format: mrs,  interval: 86400, proxy: Proxy}   # IP，mrs 格式

# ===== 远程规则集 Remote Rule =====
rule-providers:

  # ── 只用于嗅探豁免，不参与分流 ──
  R-sniffer-skip-ip:      {<<: *ip,           url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geoip/sniffer-skip-ip.mrs"}               # 不嗅探 IP
  R-sniffer-skip-misc:    {<<: *domain,       url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geosite/sniffer-skip-misc.mrs"}           # 不嗅探杂项（米家云）

  # ══════════════════════════════════════════
  # 1. 拦截（排在最前面）
  # ══════════════════════════════════════════
  R-icloudprivaterelay:   {<<: *domain,       url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geosite/icloudprivaterelay.mrs"}          # iCloud 专用代理
  R-ads:                  {<<: *domain,       url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geosite/awavenue.mrs"}                    # 广告（AWAvenue）
  R-httpdns-cn:           {<<: *domain,       url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geosite/category-httpdns-cn.mrs"}         # 国内 HTTPDNS
  R-win-spy:              {<<: *domain,       url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geosite/win-spy.mrs"}                     # Windows 隐私追踪

  # ══════════════════════════════════════════
  # 2. 局域网和必须直连的
  # ══════════════════════════════════════════
  R-private-ip:           {<<: *ip,           url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geoip/private.mrs"}                       # 内网 IP
  R-private:              {<<: *domain,       url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geosite/private.mrs"}                     # 内网域名
  R-connectivity:         {<<: *domain,       url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geosite/connectivity-check.mrs"}          # 连通性检测
  R-ipv6-all:             {<<: *ip,           url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geoip/ipv6-all.mrs"}                      # 全部 IPv6

  # ══════════════════════════════════════════
  # 3. 海外商家
  # @!cn = 国外部分，@cn = 国内部分
  # ══════════════════════════════════════════

  # ── Anthropic ──
  R-anthropic:            {<<: *domain,       url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geosite/anthropic.mrs"}                   # Anthropic / Claude
  R-anthropic-ip:         {<<: *ip,           url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geoip/anthropic.mrs"}                     # Anthropic IP

  # ── OpenAI ──
  R-openai:               {<<: *domain,       url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geosite/openai.mrs"}                      # OpenAI / ChatGPT
  R-openai-ip:            {<<: *ip,           url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geoip/openai.mrs"}                     # OpenAI IP

  # ── AI ──
  R-perplexity:           {<<: *domain,       url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geosite/perplexity.mrs"}                  # Perplexity
  R-ai:                   {<<: *domain,       url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geosite/category-ai-chat-!cn.mrs"}        # AI 杂项

  # ── GitHub ──
  R-github:               {<<: *domain,       url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geosite/github.mrs"}                      # GitHub（含 Copilot、npm）
  R-vscode:               {<<: *domain,       url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geosite/vscode.mrs"}                      # VSCode

  # ── Telegram ──
  R-telegram:             {<<: *domain,       url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geosite/telegram.mrs"}                    # Telegram
  R-telegram-ip:          {<<: *ip,           url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geoip/telegram.mrs"}                      # Telegram IP

  # ── X ──
  R-x:                    {<<: *domain,       url: "https://raw.githubusercontent.com/uhovohu/mihomo-rules/meta/geo/geosite/x.mrs"}                           # X（含 Grok）
